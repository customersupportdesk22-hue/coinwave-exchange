<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinWave - Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="admin-nav">
        <h2>🛡️ CoinWave Admin</h2>
        <a href="/" class="btn-back">Back to Site</a>
    </nav>

    <div class="admin-container">
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="orders">Pending Orders</button>
            <button class="tab-btn" data-tab="wallets">Pending Wallets</button>
            <button class="tab-btn" data-tab="settings">Global Settings</button>
        </div>

        <div id="tab-orders" class="tab-content active">
            <div id="ordersList"><p class="loading">Loading orders...</p></div>
        </div>

        <div id="tab-wallets" class="tab-content">
            <div id="walletsList"><p class="loading">Loading wallets...</p></div>
        </div>

        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h4>Fiat & Support Settings</h4>
                <div class="form-group">
                    <label>Support Email</label>
                    <input type="email" id="setSupportEmail" placeholder="support@coinwave.com">
                </div>
                <div class="form-group">
                    <label>Card Payment Link (Stripe/Paystack)</label>
                    <input type="url" id="setCardLink" placeholder="https://buy.stripe.com/...">
                </div>
                <div class="form-group">
                    <label>Your Bank Details (For Buyers)</label>
                    <textarea id="setAdminBank" placeholder="Bank: Chase&#10;Account: 123456789" style="width: 100%; height: 80px; background: #0f0f15; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 6px; font-family: monospace;"></textarea>
                </div>
                <div class="form-group">
                    <label>Your PayPal Email (For Buyers)</label>
                    <input type="email" id="setAdminPaypal" placeholder="paypal@coinwave.com">
                </div>

                <h4 style="margin-top: 30px;">Social Media & Legal</h4>
                <div class="form-group">
                    <label>Twitter / X Link</label>
                    <input type="url" id="setSocialTwitter" placeholder="https://x.com/coinwave">
                </div>
                <div class="form-group">
                    <label>Telegram Link</label>
                    <input type="url" id="setSocialTelegram" placeholder="https://t.me/coinwave">
                </div>
                <div class="form-group">
                    <label>Discord Link</label>
                    <input type="url" id="setSocialDiscord" placeholder="https://discord.gg/coinwave">
                </div>
                <div class="form-group">
                    <label>Legal Disclaimer</label>
                    <textarea id="setLegalDisclaimer" placeholder="Risk warning text..." style="width: 100%; height: 80px; background: #0f0f15; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 6px; font-family: monospace;"></textarea>
                </div>
                
                <h4 style="margin-top: 30px;">Crypto Wallets</h4>
                <div id="dynamicWalletInputs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <!-- JS will inject inputs here -->
                </div>
                
                <button class="btn-approve" onclick="saveSettings(this)" style="margin-top: 20px;">Save Settings</button>
                <p id="settingsMsg" style="color:#00d4aa; text-align:center; margin-top:10px; font-weight:bold;"></p>
            </div>
        </div>
    </div>

    <script src="admin.js?v=500"></script>
</body>
</html>
