<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinWave - Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="admin-nav">
        <h2>🛡️ CoinWave Admin</h2>
        <a href="/" class="btn-back">Back to Site</a>
    </nav>

    <div class="admin-container">
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="orders">Pending Orders</button>
            <button class="tab-btn" data-tab="wallets">Pending Wallets</button>
            <button class="tab-btn" data-tab="settings">Global Wallets</button>
        </div>

        <div id="tab-orders" class="tab-content active">
            <div id="ordersList"><p class="loading">Loading orders...</p></div>
        </div>

        <div id="tab-wallets" class="tab-content">
            <div id="walletsList"><p class="loading">Loading wallets...</p></div>
        </div>

        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h4>Global Deposit Addresses & Support</h4>
                <div class="form-group">
                    <label>Support Email</label>
                    <input type="email" id="setSupportEmail" placeholder="support@coinwave.com">
                </div>
                <div id="dynamicWalletInputs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <!-- JS will inject 25 inputs here -->
                </div>
                <button class="btn-approve" onclick="saveSettings(this)" style="margin-top: 20px;">Save Settings</button>
                <p id="settingsMsg" style="color:#00d4aa; text-align:center; margin-top:10px; font-weight:bold;"></p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
